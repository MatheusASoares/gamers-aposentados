<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join the Guild - Gamers Aposentados</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#bd0df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#1e1022",
                        "neutral-dark": "#2d1b33",
                        "neutral-border": "#4e3b54",
                        "muted-text": "#b39cba",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .gamer-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(189, 13, 242, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }
        .neon-glow:hover {
            box-shadow: 0 0 20px rgba(189, 13, 242, 0.4);
        }
        .input-focus:focus-within {
            border-color: #bd0df2;
            box-shadow: 0 0 0 1px #bd0df2;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white min-h-screen flex items-center justify-center p-4 gamer-grid">
<div class="w-full max-w-[480px] bg-white/5 dark:bg-neutral-dark/40 backdrop-blur-xl border border-neutral-border p-8 rounded-xl shadow-2xl">
<!-- Header Section -->
<div class="flex flex-col gap-2 mb-8 text-center">
<div class="mx-auto mb-4 p-3 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-4xl">sports_esports</span>
</div>
<h1 class="text-3xl font-black tracking-tight text-white leading-tight">Join the Guild</h1>
<p class="text-muted-text text-base">Create your account and start your journey.</p>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/90">Warrior Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-text text-xl group-focus-within:text-primary">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-neutral-dark/60 border border-neutral-border rounded-lg text-white placeholder:text-muted-text focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="Enter your username" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/90">Guild Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-text text-xl group-focus-within:text-primary">alternate_email</span>
<input class="w-full pl-10 pr-4 py-3 bg-neutral-dark/60 border border-neutral-border rounded-lg text-white placeholder:text-muted-text focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="your@email.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/90">Secret Code</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-text text-xl group-focus-within:text-primary">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-neutral-dark/60 border border-neutral-border rounded-lg text-white placeholder:text-muted-text focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/90">Confirm Code</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-text text-xl group-focus-within:text-primary">verified_user</span>
<input class="w-full pl-10 pr-4 py-3 bg-neutral-dark/60 border border-neutral-border rounded-lg text-white placeholder:text-muted-text focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="mt-2 w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-[0_0_15px_rgba(189,13,242,0.3)] neon-glow transition-all flex items-center justify-center gap-2" type="submit">
                Start My Adventure
                <span class="material-symbols-outlined">bolt</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-neutral-border"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-[#1e1022] px-2 text-muted-text">Or join with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white/5 border border-neutral-border rounded-lg hover:bg-white/10 transition-colors">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYNIMlXfMMH0cbINroL7ysCkQ_sWxxharkg_0AYk9Nr1wsZ5wU2UUFxCh6Cuz0lV7hnTRRjdkHpjlUSvYmFy1hUnB6RKF8pZOja_lFeUwYlLKcXilbZsLqCkb8bulH6-_zNlpcvhhXBLjAFpiDcSgicwu0lb_nGKHjCh35BvdupEsm5af9evMe18UplL7DN0TK7oOczueW4aVJooJjycNF8YI-2FwBwlmCR8vKj-h2SVzOVVImegkm97SOsDUjsUryXYaYSiX0aGg"/>
<span class="text-sm font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#5865F2]/20 border border-[#5865F2]/40 rounded-lg hover:bg-[#5865F2]/30 transition-colors">
<svg class="w-5 h-5 fill-[#5865F2]" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.086 2.157 2.419c0 1.334-.947 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.086 2.157 2.419c0 1.334-.946 2.419-2.157 2.419z"></path>
</svg>
<span class="text-sm font-medium">Discord</span>
</button>
</div>
<!-- Login Redirect -->
<p class="mt-10 text-center text-sm text-muted-text">
            Already a member? 
            <a class="text-primary font-bold hover:underline ml-1" href="#">Log in to your base</a>
</p>
</div>
<!-- Background Decorative Elements -->
<div class="fixed bottom-10 right-10 opacity-10 pointer-events-none select-none">
<span class="material-symbols-outlined text-9xl">swords</span>
</div>
<div class="fixed top-10 left-10 opacity-10 pointer-events-none select-none">
<span class="material-symbols-outlined text-9xl">headset_mic</span>
</div>
</body></html>
