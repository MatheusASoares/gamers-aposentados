<!doctype html>

<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Gamers Aposentados - Sign In</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#bd0df2",
                            "background-light": "#f8f5f8",
                            "background-dark": "#09090b", // Deep zinc/slate
                            "card-dark": "#18181b",
                            "accent-purple": "#bd0df2",
                        },
                        fontFamily: {
                            display: ["Inter", "sans-serif"],
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                    },
                },
            };
        </script>
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            .bg-pattern {
                background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23bd0df2' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            }
            .neon-glow {
                box-shadow: 0 0 15px rgba(189, 13, 242, 0.4);
            }
            .glass-morphism {
                background: rgba(24, 24, 27, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(189, 13, 242, 0.1);
            }
        </style>
    </head>
    <body
        class="bg-background-light dark:bg-background-dark bg-pattern flex min-h-screen items-center justify-center p-4 text-zinc-900 dark:text-zinc-100"
    >
        <!-- Main Container -->
        <div class="w-full max-w-md">
            <!-- Logo Section -->
            <div class="mb-8 flex flex-col items-center">
                <div class="mb-2 flex items-center gap-3">
                    <div class="bg-primary/10 rounded-lg p-2">
                        <svg
                            class="text-primary h-8 w-8"
                            fill="currentColor"
                            viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M21,6H3C1.9,6,1,6.9,1,8v8c0,1.1,0.9,2,2,2h18c1.1,0,2-0.9,2-2V8C23,6.9,22.1,6,21,6z M10,13H8v2H7v-2H5v-1h2v-2h1v2h2V13z M14.5,15c-0.8,0-1.5-0.7-1.5-1.5s0.7-1.5,1.5-1.5s1.5,0.7,1.5,1.5S15.3,15,14.5,15z M18.5,12c-0.8,0-1.5-0.7-1.5-1.5 s0.7-1.5,1.5-1.5s1.5,0.7,1.5,1.5S19.3,12,18.5,12z"
                            ></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">
                        Gamers <span class="text-primary">Aposentados</span>
                    </h1>
                </div>
                <p class="text-sm font-medium text-zinc-400">
                    Track your legacy. Your adventure continues.
                </p>
            </div>
            <!-- Auth Card -->
            <div class="glass-morphism rounded-xl p-8 shadow-2xl">
                <div class="space-y-6">
                    <!-- Header -->
                    <div>
                        <h2 class="text-xl font-semibold text-white">Login to Adventure</h2>
                        <p class="mt-1 text-sm text-zinc-400">
                            Enter your credentials to access your dashboard.
                        </p>
                    </div>
                    <!-- Form -->
                    <form class="space-y-4" onsubmit="return false;">
                        <div class="space-y-2">
                            <label
                                class="ml-1 text-xs font-medium tracking-wider text-zinc-500 uppercase"
                                >Warrior ID or Email</label
                            >
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined group-focus-within:text-primary absolute top-1/2 left-3 -translate-y-1/2 text-lg text-zinc-500 transition-colors"
                                    >alternate_email</span
                                >
                                <input
                                    class="focus:ring-primary/40 focus:border-primary w-full rounded-lg border border-zinc-800 bg-zinc-900/50 py-3 pr-4 pl-10 text-white transition-all duration-200 placeholder:text-zinc-600 focus:ring-2 focus:outline-none"
                                    placeholder="email@example.com"
                                    type="email"
                                />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between px-1">
                                <label
                                    class="text-xs font-medium tracking-wider text-zinc-500 uppercase"
                                    >Secret Code</label
                                >
                                <a
                                    class="text-primary hover:text-primary/80 text-xs font-medium transition-colors"
                                    href="#"
                                    >Forgot Password?</a
                                >
                            </div>
                            <div class="group relative">
                                <span
                                    class="material-symbols-outlined group-focus-within:text-primary absolute top-1/2 left-3 -translate-y-1/2 text-lg text-zinc-500 transition-colors"
                                    >lock</span
                                >
                                <input
                                    class="focus:ring-primary/40 focus:border-primary w-full rounded-lg border border-zinc-800 bg-zinc-900/50 py-3 pr-12 pl-10 text-white transition-all duration-200 placeholder:text-zinc-600 focus:ring-2 focus:outline-none"
                                    placeholder="••••••••"
                                    type="password"
                                />
                                <button
                                    class="absolute top-1/2 right-3 -translate-y-1/2 text-zinc-500 transition-colors hover:text-white"
                                    type="button"
                                >
                                    <span class="material-symbols-outlined text-lg"
                                        >visibility</span
                                    >
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 px-1">
                            <input
                                class="text-primary focus:ring-primary/50 h-4 w-4 rounded border-zinc-800 bg-zinc-900 focus:ring-offset-zinc-950"
                                id="remember"
                                type="checkbox"
                            />
                            <label
                                class="cursor-pointer text-sm text-zinc-400 select-none"
                                for="remember"
                                >Stay logged in to the guild</label
                            >
                        </div>
                        <button
                            class="bg-primary hover:bg-primary/90 neon-glow mt-2 flex w-full items-center justify-center gap-2 rounded-lg py-3 font-bold text-white transition-all duration-200 active:scale-[0.98]"
                        >
                            <span>Login to Adventure</span>
                            <span class="material-symbols-outlined text-sm">rocket_launch</span>
                        </button>
                    </form>
                    <!-- Separator -->
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-zinc-800"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase">
                            <span class="bg-card-dark px-2 font-medium text-zinc-500"
                                >Or continue quest with</span
                            >
                        </div>
                    </div>
                    <!-- Social Logins -->
                    <div class="grid grid-cols-2 gap-4">
                        <button
                            class="group flex items-center justify-center gap-2 rounded-lg border border-zinc-800 bg-zinc-900/50 py-2.5 transition-colors hover:bg-zinc-800"
                        >
                            <svg
                                class="h-5 w-5 grayscale transition-all group-hover:grayscale-0"
                                viewbox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4"
                                ></path>
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853"
                                ></path>
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05"
                                ></path>
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335"
                                ></path>
                            </svg>
                            <span class="text-sm font-medium text-zinc-300">Google</span>
                        </button>
                        <button
                            class="group flex items-center justify-center gap-2 rounded-lg border border-zinc-800 bg-zinc-900/50 py-2.5 transition-colors hover:bg-zinc-800"
                        >
                            <svg
                                class="h-5 w-5 text-zinc-400 transition-colors group-hover:text-[#5865F2]"
                                fill="currentColor"
                                viewbox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.196.373.291a.077.077 0 0 1-.006.127c-.576.335-1.173.633-1.791.892-.041.016-.061.065-.042.106.355.699.766 1.365 1.226 1.994a.077.077 0 0 0 .084.028 19.83 19.83 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.086 2.157 2.419 0 1.334-.947 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.086 2.157 2.419 0 1.334-.946 2.419-2.157 2.419z"
                                ></path>
                            </svg>
                            <span class="text-sm font-medium text-zinc-300">Discord</span>
                        </button>
                    </div>
                    <!-- Footer -->
                    <div class="pt-2 text-center">
                        <p class="text-sm text-zinc-500">
                            New to the guild?
                            <a
                                class="text-primary ml-1 font-semibold decoration-2 underline-offset-4 hover:underline"
                                href="#"
                                >Join us today</a
                            >
                        </p>
                    </div>
                </div>
            </div>
            <!-- Mini Footer / Terms -->
        </div>
        <!-- Decorative Elements (Low Opacity Poly Shapes) -->
        <div
            class="border-primary/10 pointer-events-none fixed top-20 left-20 -z-10 h-32 w-32 rotate-12 rounded-xl border"
        ></div>
        <div
            class="border-primary/5 pointer-events-none fixed right-40 bottom-40 -z-10 h-48 w-48 rounded-full border"
        ></div>
        <div
            class="bg-primary/5 pointer-events-none fixed top-1/2 -right-10 -z-10 h-64 w-64 rounded-full blur-[120px]"
        ></div>
        <div class="text-primary/10 fixed bottom-10 left-10 -z-10 select-none">
            <span class="material-symbols-outlined text-[120px]">sports_esports</span>
        </div>
    </body>
</html>
