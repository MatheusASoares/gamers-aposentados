<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Sidebar Component - Gamers Aposentados</title>
        <!-- Tailwind CSS v3 CDN -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <!-- Lucide Icons Script -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <style data-purpose="custom-layout">
            /* Custom scrollbar for a cleaner look if content overflows */
            .custom-scrollbar::-webkit-scrollbar {
                width: 4px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: #0f172a;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #334155;
                border-radius: 10px;
            }
            /* Smooth transition for hover states */
            .nav-item-transition {
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }
        </style>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            "gaming-purple": "#a855f7",
                            "gaming-dark": "#09090b",
                            "sidebar-bg": "#121214",
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="flex min-h-screen items-center justify-center bg-zinc-950 p-8">
        <!-- BEGIN: Sidebar Container -->
        <!-- The main container for the sidebar, isolated for demonstration -->
        <aside
            class="bg-sidebar-bg flex h-[900px] w-64 flex-col overflow-hidden rounded-l-2xl border-r border-zinc-800/50 shadow-2xl"
            data-purpose="navigation-sidebar"
            id="main-sidebar"
        >
            <!-- BEGIN: Sidebar Logo -->
            <div class="flex items-center gap-3 p-8" data-purpose="branding">
                <div
                    class="bg-gaming-purple flex h-10 w-10 items-center justify-center rounded-lg shadow-[0_0_15px_rgba(168,85,247,0.4)]"
                >
                    <i class="h-6 w-6 text-white" data-lucide="gamepad-2"></i>
                </div>
                <div>
                    <h1 class="text-lg leading-tight font-bold text-white">Gamers</h1>
                    <p class="text-gaming-purple text-sm font-medium">Aposentados</p>
                </div>
            </div>
            <!-- END: Sidebar Logo -->
            <!-- BEGIN: Navigation Links -->
            <nav
                class="custom-scrollbar mt-4 flex-1 space-y-2 overflow-y-auto px-4"
                data-purpose="main-navigation"
            >
                <!-- Dashboard Item (Active State) -->
                <a
                    class="nav-item-transition text-gaming-purple group flex items-center gap-3 rounded-xl border border-purple-500/20 bg-purple-500/10 px-4 py-3.5"
                    data-purpose="nav-dashboard"
                    href="#"
                >
                    <i class="h-5 w-5" data-lucide="layout-dashboard"></i>
                    <span class="font-semibold">Dashboard</span>
                </a>
                <!-- Quests Item -->
                <a
                    class="nav-item-transition group flex items-center gap-3 rounded-xl px-4 py-3.5 text-zinc-400 hover:bg-zinc-800/50 hover:text-white"
                    data-purpose="nav-quests"
                    href="#"
                >
                    <i class="h-5 w-5" data-lucide="swords"></i>
                    <span class="font-medium">Quests</span>
                </a>
                <!-- History Item -->
                <a
                    class="nav-item-transition group flex items-center gap-3 rounded-xl px-4 py-3.5 text-zinc-400 hover:bg-zinc-800/50 hover:text-white"
                    data-purpose="nav-history"
                    href="#"
                >
                    <i class="h-5 w-5" data-lucide="scroll-text"></i>
                    <span class="font-medium">History</span>
                </a>
                <!-- Randomizer Item -->
                <a
                    class="nav-item-transition group flex items-center gap-3 rounded-xl px-4 py-3.5 text-zinc-400 hover:bg-zinc-800/50 hover:text-white"
                    data-purpose="nav-randomizer"
                    href="#"
                >
                    <i class="h-5 w-5" data-lucide="dices"></i>
                    <span class="font-medium">Randomizer</span>
                </a>
                <!-- Shop Item with Badge -->
                <a
                    class="nav-item-transition group flex cursor-not-allowed items-center justify-between rounded-xl px-4 py-3.5 text-zinc-500 opacity-60"
                    data-purpose="nav-shop"
                    href="#"
                >
                    <div class="flex items-center gap-3">
                        <i class="h-5 w-5" data-lucide="store"></i>
                        <span class="font-medium">Shop</span>
                    </div>
                    <span
                        class="rounded bg-zinc-800 px-2 py-0.5 text-[10px] font-bold tracking-wider text-zinc-400 uppercase"
                        >Soon</span
                    >
                </a>
            </nav>
            <!-- END: Navigation Links -->
            <!-- BEGIN: Sidebar Footer -->
            <div class="space-y-2 border-t border-zinc-800/50 p-4" data-purpose="sidebar-footer">
                <!-- Settings Button -->
                <button
                    class="nav-item-transition group flex w-full items-center gap-3 rounded-xl px-4 py-3 text-zinc-400 hover:bg-zinc-800/50 hover:text-white"
                >
                    <i class="h-5 w-5" data-lucide="settings"></i>
                    <span class="text-sm font-medium">Settings</span>
                </button>
                <!-- Logout Button -->
                <button
                    class="nav-item-transition group flex w-full items-center gap-3 rounded-xl px-4 py-3 text-zinc-400 hover:bg-red-500/5 hover:text-red-400"
                >
                    <i class="h-5 w-5" data-lucide="log-out"></i>
                    <span class="text-sm font-medium">Logout</span>
                </button>
            </div>
            <!-- END: Sidebar Footer -->
        </aside>
        <!-- END: Sidebar Container -->
        <!-- JavaScript for Icon Rendering -->
        <script data-purpose="icon-initialization">
            // Initialize Lucide icons
            lucide.createIcons();
        </script>
    </body>
</html>
