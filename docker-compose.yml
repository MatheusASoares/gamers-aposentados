version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: gamers_postgres
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: gamers_aposentados
        ports:
            - "5434:5432"
        volumes:
            - postgres_data_new:/var/lib/postgresql/data

volumes:
    postgres_data_new:
